<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1d0a16" />
<title>Chạm vào trái tim 💗</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@200;300;400;500&family=Dancing+Script:wght@500;700&display=swap&subset=vietnamese" rel="stylesheet">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E">

<style>
/* ============================================================
   MÀU & NỀN
   ============================================================ */
:root{
  --bg-1:#1d0a16;
  --bg-2:#2b0e21;
  --bg-3:#3a1029;
  --rose:#ff6f9c;
  --rose-lite:#ffb3cb;
  --rose-deep:#c93f6d;
  --gold:#e8c37a;
  --gold-lite:#fff0c9;
  --gold-deep:#a97c2f;
  --cream:#ffeef4;
  --muted:#d7b9c6;
  --sans:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --script:'Dancing Script','Be Vietnam Pro',cursive;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg-1);
  color:var(--cream);
  font-family:var(--sans);
  font-weight:300;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}

/* ---- ảnh nền: phóng chậm kiểu Ken Burns ---- */
.photo{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg-1)}
.photo::after{                       /* ánh vàng phủ lên ảnh cho ấm */
  content:'';position:absolute;inset:0;
  background:linear-gradient(200deg,rgba(232,195,122,.16),transparent 45%,rgba(255,111,156,.14));
  mix-blend-mode:soft-light;
}
.photo img{position:absolute;inset:0;width:100%;height:100%;display:block}

/* bản phóng to làm mờ, chỉ để lấp kín màn hình */
.photo-nen{
  object-fit:cover;object-position:center;
  transform:scale(1.2);
  filter:blur(26px) brightness(.5) saturate(1.1);
}
/* bản nét: nguyên khung ảnh, không cắt xén, hai mép trên dưới
   mờ dần để hoà vào lớp nền chứ không đứt gãy thành một vệt */
.photo-ro{
  top:34%;left:0;height:auto;
  transform:translateY(-50%);
  filter:brightness(.92) saturate(1.16) contrast(1.05);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 84%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 84%,transparent 100%);
}
@media (orientation:landscape){
  .photo-ro{top:50%}
}

/* ---- lớp phủ để chữ luôn đọc được ---- */
.tint{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 6%, rgba(255,150,190,.18) 0%, transparent 52%),
    radial-gradient(ellipse at 50% 108%, rgba(48,8,32,.7) 0%, transparent 60%),
    linear-gradient(180deg, rgba(18,5,14,.42) 0%, rgba(26,8,20,.16) 38%, rgba(14,3,11,.62) 100%);
}

/* ---- viền khung vàng mảnh quanh màn hình ---- */
.frame{
  position:fixed;inset:10px;z-index:4;pointer-events:none;border-radius:20px;
  border:1px solid rgba(232,195,122,.22);
  box-shadow:inset 0 0 60px rgba(232,195,122,.06);
}
.frame::before,.frame::after{
  content:'';position:absolute;width:26px;height:26px;
  border:1px solid rgba(255,240,201,.5);
}
.frame::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:20px 0 0 0}
.frame::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 20px 0}
.glow{position:fixed;border-radius:50%;pointer-events:none;z-index:0;will-change:opacity,transform}
.glow.g1{width:80vw;height:80vw;top:-22vw;left:-18vw;
  background:radial-gradient(circle,rgba(255,111,156,.2) 0%,rgba(255,111,156,.07) 45%,transparent 70%);
  animation:breathe 9s ease-in-out infinite}
.glow.g2{width:70vw;height:70vw;bottom:-24vw;right:-20vw;
  background:radial-gradient(circle,rgba(232,195,122,.16) 0%,rgba(232,195,122,.05) 45%,transparent 70%);
  animation:breathe 11s ease-in-out infinite reverse}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.15);opacity:1}}

.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 48%,rgba(12,4,10,.5) 100%);
}

/* ============================================================
   TIM BAY LƠ LỬNG Ở NỀN
   ============================================================ */
#floaters{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.floater{
  position:absolute;bottom:-8vh;
  color:var(--rose-lite);opacity:0;
  animation:floatUp linear infinite;
  will-change:transform,opacity;
}
@keyframes floatUp{
  0%{transform:translate(0,0) rotate(0deg) scale(.8);opacity:0}
  10%{opacity:.3}
  90%{opacity:.18}
  100%{transform:translate(var(--dx),-112vh) rotate(var(--rot)) scale(1.1);opacity:0}
}

/* ---- bụi vàng lấp lánh ---- */
#sparkles{position:fixed;inset:0;z-index:1;pointer-events:none}
.spark{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,#fff8e2 0%,rgba(232,195,122,.75) 40%,transparent 70%);
  box-shadow:0 0 8px rgba(255,224,160,.8);
  animation:twinkle ease-in-out infinite;
  will-change:opacity,transform;
}
@keyframes twinkle{
  0%,100%{opacity:0;transform:scale(.4)}
  50%{opacity:.95;transform:scale(1.25)}
}

/* ============================================================
   BỐ CỤC CHÍNH
   ============================================================ */
.stage{
  position:relative;z-index:2;
  height:100svh;height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(14px,3.2vh,28px);
  padding:max(22px,env(safe-area-inset-top)) 24px max(22px,env(safe-area-inset-bottom));
  text-align:center;
}

.title{
  font-family:var(--script);font-weight:700;
  font-size:clamp(32px,8.4vw,48px);
  line-height:1.15;
  background:linear-gradient(100deg,
    #ffd9e6 0%, var(--gold-lite) 22%, var(--gold) 38%,
    #fff6de 50%, var(--gold) 62%, #ffc7db 82%, #ffe9f0 100%);
  background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 0 20px rgba(255,140,180,.35)) drop-shadow(0 2px 10px rgba(0,0,0,.5));
  animation:fadeDown 1.2s .2s both, shimmer 7s linear infinite 1s;
}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:260% 50%}}

/* gạch trang trí hai bên phụ đề */
.subtitle{
  display:flex;align-items:center;justify-content:center;gap:12px;
  font-size:clamp(10px,2.8vw,12px);font-weight:200;
  letter-spacing:.34em;text-transform:uppercase;color:var(--muted);
  text-shadow:0 1px 10px rgba(0,0,0,.6);
  margin-top:8px;
  animation:fadeDown 1.2s .45s both;
}
.subtitle::before,.subtitle::after{
  content:'';height:1px;width:clamp(22px,7vw,46px);
  background:linear-gradient(90deg,transparent,rgba(232,195,122,.75),transparent);
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

/* ============================================================
   TRÁI TIM
   ============================================================ */
.heart-zone{
  position:relative;
  width:clamp(180px,52vw,250px);
  aspect-ratio:1;
  display:grid;place-items:center;
  cursor:pointer;
  animation:fadeIn 1.4s .6s both;
}
@keyframes fadeIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}

/* quầng sáng vàng quay chậm sau lưng tim */
.halo{
  position:absolute;width:125%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,
    transparent 0deg, rgba(255,214,150,.42) 40deg, transparent 110deg,
    rgba(255,140,180,.4) 175deg, transparent 250deg,
    rgba(255,240,201,.35) 305deg, transparent 360deg);
  filter:blur(20px);
  animation:spinHalo 16s linear infinite;
  will-change:transform;
}
@keyframes spinHalo{to{transform:rotate(360deg)}}

/* tia sáng mảnh toả ra như ngôi sao */
.rays{
  position:absolute;width:150%;aspect-ratio:1;pointer-events:none;opacity:.5;
  background:repeating-conic-gradient(
    from 0deg,
    rgba(255,240,201,.16) 0deg 1.2deg,
    transparent 1.2deg 15deg);
  -webkit-mask-image:radial-gradient(circle,transparent 32%,#000 46%,transparent 74%);
  mask-image:radial-gradient(circle,transparent 32%,#000 46%,transparent 74%);
  animation:spinHalo 46s linear infinite reverse;
  will-change:transform;
}

/* vòng sáng toả ra liên tục quanh tim */
.aura-ring{
  position:absolute;width:78%;aspect-ratio:1;border-radius:50%;
  border:1px solid rgba(255,190,140,.55);
  box-shadow:0 0 18px rgba(255,200,150,.25);
  animation:auraOut 3.2s ease-out infinite;
  pointer-events:none;
}
.aura-ring:nth-child(2){animation-delay:1.6s}
@keyframes auraOut{
  0%{transform:scale(.7);opacity:.55}
  100%{transform:scale(1.65);opacity:0}
}

/* vòng nổ ra khi chạm */
.tap-ring{
  position:absolute;width:70%;aspect-ratio:1;border-radius:50%;
  border:2px solid rgba(255,179,203,.85);
  pointer-events:none;opacity:0;
}
.tap-ring.go{animation:tapOut .75s cubic-bezier(.16,.8,.3,1) forwards}
@keyframes tapOut{
  0%{transform:scale(.6);opacity:.9}
  100%{transform:scale(2.1);opacity:0}
}

/* quầng sáng của tim: vẽ sẵn bằng gradient, không dùng filter cho nhẹ */
.tim-quang{
  position:absolute;width:132%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,79,132,.42) 0%,rgba(255,111,156,.16) 40%,transparent 66%);
}

/* nhịp đập nằm ở lớp bọc ngoài -> trình duyệt chỉ việc phóng to thu nhỏ
   ảnh đã vẽ sẵn, không phải vẽ lại bóng đổ ở từng khung hình */
.heart-beat{
  width:100%;height:100%;
  animation:beat 1.7s ease-in-out infinite;
  transform-origin:50% 55%;
  will-change:transform;
}
.heart-svg{
  width:100%;height:100%;display:block;
  filter:drop-shadow(0 8px 26px rgba(0,0,0,.5));
}
@keyframes beat{
  0%,100%{transform:scale(1)}
  14%{transform:scale(1.075)}
  28%{transform:scale(1)}
  42%{transform:scale(1.045)}
  58%{transform:scale(1)}
}
.heart-zone:active .heart-beat{animation:squish .45s ease-out}
@keyframes squish{
  0%{transform:scale(1)}
  22%{transform:scale(.9)}
  55%{transform:scale(1.14)}
  100%{transform:scale(1)}
}

/* đốm sáng nhỏ chạy trên mặt tim */
.shine{animation:shineMove 4.5s ease-in-out infinite}
@keyframes shineMove{
  0%,100%{opacity:.55;transform:translate(0,0)}
  50%{opacity:.9;transform:translate(4px,-5px)}
}

/* ============================================================
   GỢI Ý & THẺ LỜI NHẮN
   ============================================================ */
.hint{
  font-size:clamp(13px,3.6vw,15px);font-weight:200;
  color:#ffdce8;letter-spacing:.05em;
  text-shadow:0 1px 10px rgba(0,0,0,.6);
  animation:hintPulse 2.8s ease-in-out infinite;
}
@keyframes hintPulse{0%,100%{opacity:.45}50%{opacity:1}}
.hint.gone{display:none}

.card{
  position:relative;
  width:min(520px,92vw);
  min-height:132px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:28px 24px 26px;
  border-radius:22px;
  background:
    linear-gradient(160deg,rgba(255,246,222,.10),rgba(255,255,255,.03) 55%,rgba(255,111,156,.07));
  box-shadow:0 22px 60px rgba(16,3,12,.55), inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);
  opacity:0;transform:translateY(14px) scale(.97);
  transition:opacity .5s ease, transform .5s cubic-bezier(.16,.8,.3,1);
  pointer-events:none;
}
/* viền vàng chuyển sắc */
.card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(145deg,rgba(255,240,201,.75),rgba(232,195,122,.25) 35%,rgba(255,150,190,.5) 70%,rgba(255,240,201,.6));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;
}
.card.show{opacity:1;transform:none}

.chip{
  font-size:10.5px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold-lite);
  padding:5px 14px;border-radius:999px;
  background:linear-gradient(120deg,rgba(232,195,122,.2),rgba(255,111,156,.16));
  border:1px solid rgba(232,195,122,.42);
  box-shadow:0 0 18px rgba(232,195,122,.14);
}
.msg{
  font-size:clamp(16px,4.4vw,19px);font-weight:300;line-height:1.75;
  color:#fff7fa;
  text-shadow:0 1px 12px rgba(0,0,0,.35);
  text-wrap:pretty;
}
.sign{
  font-family:var(--script);font-size:20px;
  color:var(--gold);opacity:.9;
  text-shadow:0 0 14px rgba(232,195,122,.35);
}

.counter{
  font-size:11px;font-weight:200;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(255,224,170,.8);
  text-shadow:0 1px 10px rgba(0,0,0,.65);
  min-height:16px;
}

/* nút tắt/bật tiếng */
.sound-btn{
  position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:6;
  width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(232,195,122,.35);
  color:var(--gold-lite);font-size:15px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:transform .2s ease, opacity .3s ease;
  opacity:.65;
}
.sound-btn:active{transform:scale(.9)}

/* lớp vẽ hiệu ứng nổ */
#fx{position:fixed;inset:0;z-index:5;pointer-events:none}

/* ============================================================
   MÀN HÌNH KHOÁ
   ============================================================ */
#khoa{
  position:fixed;inset:0;z-index:20;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:rgba(10,3,9,.38);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(3px);
  transition:opacity .8s ease, visibility .8s;
}
#khoa.mo{opacity:0;visibility:hidden;pointer-events:none}

.hop-khoa{
  position:relative;
  width:min(400px,100%);
  padding:34px 24px 28px;border-radius:24px;text-align:center;
  background:linear-gradient(160deg,rgba(255,246,222,.12),rgba(20,6,16,.55) 60%,rgba(255,111,156,.1));
  box-shadow:0 26px 70px rgba(10,2,8,.6), inset 0 1px 0 rgba(255,255,255,.14);
  backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  animation:fadeIn .9s .2s both;
}
.hop-khoa::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(145deg,rgba(255,240,201,.8),rgba(232,195,122,.25) 40%,rgba(255,150,190,.55) 75%,rgba(255,240,201,.7));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.hop-khoa.rung{animation:rung .5s}
@keyframes rung{
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-11px)}35%{transform:translateX(9px)}
  55%{transform:translateX(-6px)}75%{transform:translateX(4px)}
}

.khoa-tim{font-size:30px;filter:drop-shadow(0 0 14px rgba(255,111,156,.6));animation:beat 1.9s ease-in-out infinite}
.khoa-tieu{
  font-family:var(--script);font-size:29px;margin-top:8px;
  background:linear-gradient(100deg,#ffd9e6,var(--gold-lite) 40%,var(--gold) 60%,#ffe9f0);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.khoa-phu{font-size:12.5px;font-weight:200;color:var(--muted);margin-top:6px;line-height:1.6}

.o-nhap{
  width:100%;margin-top:16px;padding:13px 16px;border-radius:14px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(232,195,122,.3);
  color:#fff6f9;font-family:var(--sans);font-weight:300;font-size:15px;
  outline:none;transition:border-color .25s ease, background .25s ease;
}
.o-nhap::placeholder{color:rgba(215,185,198,.5)}
.o-nhap:focus{border-color:rgba(255,214,150,.75);background:rgba(255,255,255,.11)}

.nut-mo{
  width:100%;margin-top:18px;padding:14px;border-radius:14px;cursor:pointer;
  border:1px solid rgba(255,240,201,.45);
  background:linear-gradient(120deg,#ff6f9c,#c93f6d 55%,#a97c2f);
  color:#fff8ec;font-family:var(--sans);font-weight:400;font-size:14.5px;letter-spacing:.12em;text-transform:uppercase;
  box-shadow:0 10px 30px rgba(201,63,109,.35);
  transition:transform .18s ease, box-shadow .25s ease;
}
.nut-mo:active{transform:scale(.97)}

.loi-sai{
  margin-top:14px;min-height:20px;
  font-size:14px;font-weight:400;color:#ff8ba6;
  text-shadow:0 0 12px rgba(255,79,132,.4);
  opacity:0;transition:opacity .3s ease;
}
.loi-sai.hien{opacity:1}

/* ============================================================
   ĐIỆN THOẠI: bỏ bớt mấy hiệu ứng đắt tiền cho chạy mượt
   ============================================================ */
@media (pointer:coarse){
  .rays{display:none}
  .halo{filter:blur(14px)}
  #khoa{backdrop-filter:none;-webkit-backdrop-filter:none}
  .card{
    backdrop-filter:none;-webkit-backdrop-filter:none;
    background:linear-gradient(160deg,rgba(48,15,34,.84),rgba(24,7,19,.88));
  }
  .hop-khoa{
    backdrop-filter:none;-webkit-backdrop-filter:none;
    background:linear-gradient(160deg,rgba(48,15,34,.9),rgba(22,7,17,.93));
  }
  .photo-nen{filter:blur(20px) brightness(.5) saturate(1.1)}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important}
}
</style>
</head>
<body>

<div class="photo">
  <img class="photo-nen" src="images/2.jpg" alt="" aria-hidden="true">
  <img class="photo-ro"  src="images/2.jpg" alt="">
</div>
<div class="tint"></div>
<div class="glow g1"></div>
<div class="glow g2"></div>
<div id="sparkles"></div>
<div id="floaters"></div>
<div class="vignette"></div>
<div class="frame"></div>

<!-- ===== MÀN HÌNH KHOÁ ===== -->
<div id="khoa">
  <form class="hop-khoa" id="hopKhoa" autocomplete="off">
    <div class="khoa-tim">💗</div>
    <h2 class="khoa-tieu">Đúng người mới mở</h2>
    <p class="khoa-phu">Nếu em là người anh đang nghĩ tới,<br>hai câu này dễ lắm.</p>

    <input class="o-nhap" id="oTen" type="text" placeholder="Tên của em là gì?"
           autocomplete="off" autocapitalize="words" spellcheck="false">
    <input class="o-nhap" id="oNgay" type="text" inputmode="numeric"
           placeholder="Ngày sinh của em? (vd 08/09/2004)" autocomplete="off">

    <button class="nut-mo" type="submit">Mở ra</button>
    <p class="loi-sai" id="loiSai"></p>
  </form>
</div>

<div class="sound-btn" id="soundBtn" title="Bật/tắt tiếng">♪</div>

<main class="stage">
  <div>
    <h1 class="title" id="title">Gửi em</h1>
    <p class="subtitle">một điều nhỏ, mỗi lần chạm</p>
  </div>

  <div class="heart-zone" id="heartZone" role="button" tabindex="0" aria-label="Chạm vào trái tim">
    <span class="rays"></span>
    <span class="halo"></span>
    <span class="aura-ring"></span>
    <span class="aura-ring"></span>
    <span class="tap-ring" id="tapRing"></span>

    <span class="tim-quang"></span>

    <div class="heart-beat">
    <svg class="heart-svg" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <radialGradient id="hg" cx="34%" cy="26%" r="82%">
          <stop offset="0%"  stop-color="#ffe1ea"/>
          <stop offset="26%" stop-color="#ff8fb4"/>
          <stop offset="60%" stop-color="#ee4a80"/>

const KHOA_DUNG = [
  '5c7fba808007485e407dc38e737c85778c15054e311b04ae3ac480a8f81d6f32',
  '37489fc61513b153100f5ab3f6aaddad146d4367eb0c1de10e9216a17947b27b',

/* bỏ dấu, gộp khoảng trắng: "Phạm Thu Hương" -> "pham thu huong" */
function boDau(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
          .replace(/[đĐ]/g,'d')
          .toLowerCase().trim().replace(/\s+/g,' ');
}

/* mọi kiểu gõ ngày sinh đều quy về ddmmyyyy */
function chuanNgay(s){
  const t = s.trim().replace(/\s+/g,'');
  const p = t.split(/[\/\-.,]/).filter(Boolean);
  const ra = [];
  if(p.length === 3 && p.every(x => /^\d+$/.test(x))){
    let y = p[2]; if(y.length === 2) y = '20' + y;
    ra.push(p[0].padStart(2,'0') + p[1].padStart(2,'0') + y);
  }
  const so = t.replace(/\D/g,'');
  if(so) ra.push(so, so.padStart(8,'0'));
  if(so.length === 7) ra.push(so[0] + '0' + so.slice(1));
  return [...new Set(ra)];
}

/* SHA-256 tự viết: dùng khi trình duyệt không cho crypto.subtle
   (mở qua http trong wifi nhà thì bị chặn, chỉ https mới cho) */
function sha256Tay(chuoi){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const b=[]; for(const x of unescape(encodeURIComponent(chuoi))) b.push(x.charCodeAt(0));
  const bit=b.length*8; b.push(0x80); while(b.length%64!==56) b.push(0);
  for(let i=7;i>=0;i--) b.push((i<4? Math.floor(bit/Math.pow(2,i*8)) : 0)&0xff);
  const R=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let i=0;i<b.length;i+=64){
    const w=new Array(64);
    for(let j=0;j<16;j++) w[j]=(b[i+j*4]<<24)|(b[i+j*4+1]<<16)|(b[i+j*4+2]<<8)|b[i+j*4+3];
    for(let j=16;j<64;j++){
      const s0=R(w[j-15],7)^R(w[j-15],18)^(w[j-15]>>>3);
      const s1=R(w[j-2],17)^R(w[j-2],19)^(w[j-2]>>>10);
      w[j]=(w[j-16]+s0+w[j-7]+s1)|0;
    }
    let [a,c,d,e,f,g,h,l]=H;
    for(let j=0;j<64;j++){
      const S1=R(f,6)^R(f,11)^R(f,25), ch=(f&g)^(~f&h);
      const t1=(l+S1+ch+K[j]+w[j])|0;
      const S0=R(a,2)^R(a,13)^R(a,22), mj=(a&c)^(a&d)^(c&d);
      const t2=(S0+mj)|0;
      l=h; h=g; g=f; f=(e+t1)|0; e=d; d=c; c=a; a=(t1+t2)|0;
    }
    H=[a,c,d,e,f,g,h,l].map((v,k)=>(v+H[k])|0);
  }
  return H.map(v=>((v>>>0).toString(16).padStart(8,'0'))).join('');
}

async function bam(chuoi){
  if(window.crypto && crypto.subtle){
    try{
      const bo = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(chuoi));
      return [...new Uint8Array(bo)].map(b => b.toString(16).padStart(2,'0')).join('');
    }catch(_){}
  }
  return sha256Tay(chuoi);
}

/* ------------------------------------------------------------
   Mỗi màu được vẽ sẵn MỘT LẦN ra một "con tem" nhỏ, quầng sáng
   nướng luôn vào tem. Lúc nổ chỉ dán tem lên màn hình — nhẹ hơn
   nhiều so với vẽ đường cong + shadowBlur cho từng hạt, từng khung.
   ------------------------------------------------------------ */
const TEM = new Map();
const CO_TEM = 48;

function tem(mau, sao){
  const khoa = mau + (sao ? '*' : '');
  if(TEM.has(khoa)) return TEM.get(khoa);

  const c = document.createElement('canvas');
  c.width = c.height = CO_TEM;
  const g = c.getContext('2d');
  const r = parseInt(mau.slice(1,3),16),
        l = parseInt(mau.slice(3,5),16),
        b = parseInt(mau.slice(5,7),16);

  const quang = g.createRadialGradient(CO_TEM/2,CO_TEM/2,0,CO_TEM/2,CO_TEM/2,CO_TEM/2);
  quang.addColorStop(0,   `rgba(${r},${l},${b},.5)`);
  quang.addColorStop(.42, `rgba(${r},${l},${b},.16)`);
  quang.addColorStop(1,   `rgba(${r},${l},${b},0)`);
  g.fillStyle = quang;
  g.fillRect(0,0,CO_TEM,CO_TEM);

  g.translate(CO_TEM/2, CO_TEM/2);
  g.fillStyle = mau; g.strokeStyle = mau;
  if(sao){
    g.lineWidth = 2.4; g.lineCap = 'round';
    g.beginPath();
    g.moveTo(-10,0); g.lineTo(10,0); g.moveTo(0,-10); g.lineTo(0,10);
    g.stroke();
  }else{
    g.scale(1.55,1.55);
    g.beginPath();
    g.moveTo(0,4.4);
    g.bezierCurveTo(-7.4,-2.8,-7.4,-11.6,0,-8);
    g.bezierCurveTo(7.4,-11.6,7.4,-2.8,0,4.4);
    g.closePath(); g.fill();
  }
  TEM.set(khoa, c);
  return c;
}
/* vẽ sẵn hết ngay từ đầu để lần chạm đầu tiên không bị khựng */
MAU.forEach(m => { tem(m,false); tem(m,true); });

const TRAN_HAT = MAY_CAM_TAY ? 90 : 220;

function no(x, y, soHat){
  if(MAY_CAM_TAY) soHat = Math.round(soHat * .68);
  soHat = Math.min(soHat, TRAN_HAT - hat.length);
  for(let i=0;i<soHat;i++){
    const goc = Math.random()*Math.PI*2;
    const toc = 2.2 + Math.random()*8.5;
    const sao = Math.random() < .28;
    hat.push({
      x, y,
      vx: Math.cos(goc)*toc,
      vy: Math.sin(goc)*toc - 2.4,
      s : .8 + Math.random()*2.2,
      r : Math.random()*Math.PI*2,
      vr: (Math.random()-.5)*.22,
      doi: 0,
      max: 52 + Math.random()*46,
      tem: tem(MAU[(Math.random()*MAU.length)|0], sao),
    });
  }
  if(!dangChay){ dangChay = true; requestAnimationFrame(vong); }
}

function vong(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  const cao = innerHeight + 60;
  for(let i=hat.length-1;i>=0;i--){
    const p = hat[i];
    p.doi++;
    p.vy += .16;            // trọng lực
    p.vx *= .988; p.vy *= .988;
    p.x += p.vx; p.y += p.vy; p.r += p.vr;

    const mo = 1 - p.doi/p.max;
    if(mo <= 0 || p.y > cao){ hat.splice(i,1); continue; }

    const kt = p.s * 22;
    ctx.globalAlpha = mo;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.r);
    ctx.drawImage(p.tem, -kt/2, -kt/2, kt, kt);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  ctx.globalAlpha = 1;
  if(hat.length){ requestAnimationFrame(vong); }
  else { dangChay = false; ctx.clearRect(0,0,innerWidth,innerHeight); }
}

/* ============================================================
   ÂM THANH NHỎ (tự tạo, không cần file)
   ============================================================ */
let am = null, batTieng = localStorage.getItem('qrheart-am') !== 'off';
soundBtn.textContent = batTieng ? '♪' : '♪̸';
soundBtn.style.opacity = batTieng ? '.75' : '.35';

soundBtn.addEventListener('click', e=>{
  e.stopPropagation();
  batTieng = !batTieng;
  localStorage.setItem('qrheart-am', batTieng ? 'on' : 'off');
  soundBtn.textContent = batTieng ? '♪' : '♪̸';
  soundBtn.style.opacity = batTieng ? '.75' : '.35';
  if(batTieng) keu(0);
});

const THANG_AM = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
function keu(buoc){
  if(!batTieng) return;
  try{
    am = am || new (window.AudioContext || window.webkitAudioContext)();
    if(am.state === 'suspended') am.resume();
    const t = am.currentTime;
    const f = THANG_AM[buoc % THANG_AM.length];
    [[f,.16],[f*2,.05]].forEach(([tanSo,manh])=>{
      const o = am.createOscillator(), g = am.createGain();
      o.type = 'sine'; o.frequency.value = tanSo;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(manh, t + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t + .55);
      o.connect(g); g.connect(am.destination);
      o.start(t); o.stop(t + .6);
    });
  }catch(_){}
}

/* ============================================================
   CHẠM VÀO TIM
   ============================================================ */
let dangKhoa = false;

function chamTim(){
  if(dangKhoa) return;
  dangKhoa = true;
  setTimeout(()=>dangKhoa = false, 170);

  // vòng sáng lan ra
  tapRing.classList.remove('go');
  void tapRing.offsetWidth;
  tapRing.classList.add('go');

  // nổ tim từ giữa trái tim
  const o = heartZone.getBoundingClientRect();
  no(o.left + o.width/2, o.top + o.height*.52, 34 + ((Math.random()*10)|0));

  // rung nhẹ + tiếng chuông
  if(navigator.vibrate) navigator.vibrate(12);
  keu(daMo);

  hintEl.classList.add('gone');
  hienLoi(loiTiepTheo());
}

/* pointerdown ăn ngay lúc ngón tay chạm xuống, không phải đợi
   trình duyệt xác nhận đó là cú click -> bấm thấy nhạy hơn hẳn */
let coPointer = false;
heartZone.addEventListener('pointerdown', ()=>{ coPointer = true; chamTim(); });
heartZone.addEventListener('click', ()=>{ if(!coPointer) chamTim(); });
heartZone.addEventListener('keydown', e=>{
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); chamTim(); }
});

// chạm chỗ trống trên màn hình cũng bung vài trái tim nhỏ cho vui
document.addEventListener('pointerdown', e=>{
  if(khoa.style.display !== 'none') return;               // đang ở màn khoá thì thôi
  if(heartZone.contains(e.target) || soundBtn.contains(e.target)) return;
  no(e.clientX, e.clientY, 7);
});
